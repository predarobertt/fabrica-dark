[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fabrica-dark"
version = "0.1.0"
description = "Fabrica Dark - Industrial Manufacturing Data Platform"
requires-python = ">=3.12"

dependencies = []

[project.optional-dependencies]

dev = ["pytest", "ruff",]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"